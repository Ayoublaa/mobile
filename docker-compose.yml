version: "3.9"
services:
  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
  frontend:
    build: ./frontend
    command: npm run start
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
